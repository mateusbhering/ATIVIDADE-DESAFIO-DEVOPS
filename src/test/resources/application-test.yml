# Testes usam H2 em memoria: nao precisam de PostgreSQL no pipeline
spring:
  datasource:
    url: jdbc:h2:mem:cidades_esg;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
        hbm2ddl:
          create_namespaces: false

app:
  env: test
  version: test
  seed: false
